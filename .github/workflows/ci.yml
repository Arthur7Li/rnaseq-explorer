name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          if [ -f pyproject.toml ]; then
            uv sync --dev
          else
            echo "No pyproject.toml yet; skipping dependency install."
          fi

      - name: Lint
        run: |
          if [ -f pyproject.toml ]; then
            uv run ruff check .
          else
            echo "No pyproject.toml yet; skipping lint."
          fi

      - name: Test
        run: |
          if [ -f pyproject.toml ]; then
            uv run pytest
          else
            echo "No pyproject.toml yet; skipping tests."
          fi

      - name: Forbidden data file check
        run: |
          if git ls-files | grep -E '\.(fastq|fastq\.gz|fq|fq\.gz|bam|cram|sam)$'; then
            echo "Raw sequencing files are not permitted in this repository." && exit 1
          else
            echo "No forbidden raw sequencing files found."
          fi
