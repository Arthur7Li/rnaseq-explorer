[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rnax"
version = "0.1.0"
description = "RNA-seq Explorer: Reproducible bulk RNA-seq differential-expression analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
rnax = "rnax.cli:app"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
